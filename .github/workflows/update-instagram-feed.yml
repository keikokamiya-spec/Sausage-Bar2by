name: Update Instagram Feed

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    env:
      APIFY_DATASET_ID: lORSwNRH7wBUm23aj
      APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip when secret is not configured
        if: env.APIFY_API_TOKEN == ''
        run: echo "APIFY_API_TOKEN secret is not set. Skipping feed update."

      - name: Fetch latest Instagram posts from Apify
        if: env.APIFY_API_TOKEN != ''
        run: |
          mkdir -p data

          curl -fsSL "https://api.apify.com/v2/datasets/${APIFY_DATASET_ID}/items?token=${APIFY_API_TOKEN}" \
            | jq 'map({url, displayUrl})[:4]' > data/instagram.json

      - name: Commit updated feed
        if: env.APIFY_API_TOKEN != ''
        run: |
          if git diff --quiet -- data/instagram.json; then
            echo "No feed changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram.json
          git commit -m "Update Instagram feed"
          git push
